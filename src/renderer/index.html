<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: app:; media-src 'self' blob: app:; font-src 'self'; connect-src 'self' app:; form-action 'none'; base-uri 'none'"
    />
    <title>p2pAnon Messenger</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/chat.css" />
    <link rel="stylesheet" href="css/modals.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#6366f1" />
          <stop offset="50%" stop-color="#a855f7" />
          <stop offset="100%" stop-color="#ec4899" />
        </linearGradient>
      </defs>
    </svg>

    <div class="app" id="app" hidden>
      <header class="titlebar">
        <div class="titlebar__brand">
          <svg class="titlebar__logo" viewBox="0 0 512 512" aria-hidden="true">
            <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#logoGrad)" />
            <rect
              x="124"
              y="142"
              width="264"
              height="208"
              rx="46"
              fill="#fdfdff"
            />
            <path d="M152 320 L126 410 L240 340 Z" fill="#fdfdff" />
            <path
              d="M198 266 a58 58 0 0 0 116 0"
              fill="none"
              stroke="url(#logoGrad)"
              stroke-width="15"
              stroke-linecap="round"
            />
          </svg>
          <span>p2pAnon Messenger</span>
        </div>
        <div class="titlebar__mid">
          <span class="titlebar__net" id="netPill" title="Состояние сети">
            <i class="dot"></i><span id="netPillText">P2P · без сервера</span>
          </span>
        </div>
        <div class="wincontrols">
          <button class="wc" data-win="minimize" title="Свернуть" aria-label="Свернуть">
            <svg viewBox="0 0 12 12"><path d="M2 6h8" /></svg>
          </button>
          <button class="wc" data-win="maximize" title="Развернуть" aria-label="Развернуть">
            <svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1" /></svg>
          </button>
          <button class="wc wc--close" data-win="close" title="Закрыть" aria-label="Закрыть">
            <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" /></svg>
          </button>
        </div>
      </header>

      <main class="shell" id="shell" data-section="chats">
        <nav class="rail" id="rail" aria-label="Разделы"></nav>

        <aside class="sidebar" id="sidebar">
          <div class="sidebar__head">
            <h1 class="sidebar__title">
              <span id="sidebarTitle">Чаты</span>
              <span class="sidebar__actions">
                <button class="btn btn--ghost btn--icon" id="btnInvite" title="Пригласить (Ctrl+I)">
                  <svg class="icon"><use href="#i-qr" /></svg>
                </button>
                <button class="btn btn--ghost btn--icon" id="btnNewChat" title="Найти в сети">
                  <svg class="icon"><use href="#i-radar" /></svg>
                </button>
              </span>
            </h1>
            <label class="search" id="searchWrap">
              <svg class="icon"><use href="#i-search" /></svg>
              <input class="input" id="search" type="search" placeholder="Поиск по чатам" autocomplete="off" />
              <button class="search__clear" id="searchClear" title="Очистить">
                <svg class="icon"><use href="#i-x" /></svg>
              </button>
            </label>
          </div>
          <div class="filters" id="filters"></div>
          <div class="list" id="chatList" role="listbox" aria-label="Контакты"></div>
          <div class="sidebar__foot" id="sidebarFoot"></div>
        </aside>

        <section class="stage" id="stage">
          <div class="view" id="view"></div>
          <div class="dropzone" id="dropzone">
            <svg class="icon icon--lg"><use href="#i-download" /></svg>
            <div>Отпустите, чтобы отправить</div>
          </div>
        </section>
      </main>
    </div>

    <div id="onboardRoot"></div>
    <div class="lightbox" id="lightbox"></div>
    <div class="toasts" id="toasts"></div>
    <div id="layer"></div>

    <svg width="0" height="0" style="position: absolute" aria-hidden="true" id="sprite"></svg>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
